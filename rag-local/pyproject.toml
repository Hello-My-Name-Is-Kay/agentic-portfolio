[project]
name = "rag-local"
version = "0.1.0"
description = "Retrieval-Augmented Generation over rental-policy documents using local models (Ollama + Chroma)"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "structlog>=24.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.6.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "torch>=2.0.0",
    "transformers>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
rag = "rag_local.cli:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "ARG", "C4", "D", "SIM", "TCH", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"