name: mock-booking-api
on:
  push:
    paths: ["mock-booking-api/**", ".github/workflows/mock-booking-api.yml"]
  pull_request:
    paths: ["mock-booking-api/**", ".github/workflows/mock-booking-api.yml"]
jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock-booking-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict src
      - run: pytest
      - run: pip-audit
