[project]
name = "flagship-agent"
version = "0.4.2"
description = "LangGraph customer-service agent for car rental — flagship portfolio project"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "structlog>=24.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.0",
    "langgraph>=1.0.0",
    "langchain-aws>=1.0.0",
    "botocore[crt]>=1.40.0",  # crt is needed for `aws login` credentials
]

[project.optional-dependencies]
agentcore = [
    "bedrock-agentcore>=1.26.0",
    "langgraph-checkpoint-aws>=1.2.7",
]
dev = [
    "flagship-agent[agentcore]",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
agent = "agent.cli:main"
agent-agentcore = "agent.agentcore:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "ARG", "C4", "D", "SIM", "TCH", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "TC"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "fakes"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"